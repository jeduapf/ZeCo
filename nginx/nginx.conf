events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    upstream frontend {
        server frontend:5173;
    }

    upstream backend {
        server backend:8000;
    }

    # HTTP Server (Guest Channel)
    server {
        listen 80; # No ssl 
        server_name localhost;

        # Serve the certificate for download
        location /zeco.crt {
            alias /certs/cert.pem;
            add_header Content-Disposition "attachment; filename=zeco.crt";
        }

        # Frontend Proxy
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Backend Proxy (if needed for guest features)
        location /api/ {
            proxy_pass http://backend/api/; # Note the trailing slash to strip /api/ prefix if backend expects it, or adjust based on backend routing
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # HTTPS Server (Staff Channel)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        # Frontend Proxy
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Backend Proxy
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
