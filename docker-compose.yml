services:
  backend:
    image: zeco-backend:latest
    build: ./backend
    # ports:
    #   - '8000:8000' # Backend is isolated, only accessible via internal network
    volumes:
      - ./backend:/backend
      # - ./certs:/certs # Mount certificates (Commented out for HTTP mode)
    env_file:
      - ./backend/.env  # Load all environment variables from the .env file
    environment:
      - PYTHONUNBUFFERED=1
      # Only override if needed for Docker
      - DATABASE_URL=sqlite+aiosqlite:///./DATABASE.db
    healthcheck:
      # Use Python to perform the healthcheck (avoids requiring curl/wget in the slim image)
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zeco-network

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_API_BASE_URL=/api/v1 # (Relative path for hostname agnostic access)
      - VITE_DEBUG=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # - ./certs:/app/certs # Mount certificates for Vite HTTPS (Commented out for HTTP mode)
    command: sh -c "npm install && npm run generate-theme && npm run dev"
    networks:
      - zeco-network

networks:
  zeco-network:
    driver: bridge