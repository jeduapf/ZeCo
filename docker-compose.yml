services:
  backend:
    image: zeco-backend:latest
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/backend
    env_file:
      - ./backend/.env  # Load all environment variables from the .env file
    environment:
      - PYTHONUNBUFFERED=1
      # Only override if needed for Docker
      - DATABASE_URL=sqlite+aiosqlite:///./DATABASE.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DEBUG=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"